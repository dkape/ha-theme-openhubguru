# OpenHubGuru – Home Assistant Theme
# OLED High-Tech Darkmode mit Cyan/Sky-Akzent, abgeleitet aus den Design-Tokens
# des OpenHubGuru-Frontends (frontend/public/index.html, tailwind.config):
#   brand  #38bdf8 / hover #0ea5e9 / dark #0369a1
#   oled   bg #05070c / surface #0d131f / card #121a2b / border #1e293b
# Spezifikation: docs/Home-Assistant-Theme-Specification.md (Karte c-6e41d4)
#
# Dark-only: Die Palette liegt unter modes.dark (damit HA den Dark-Mode-Flag
# setzt) und wird per YAML-Anker auch für modes.light verwendet – das Theme
# sieht also unabhängig von der Profil-Einstellung gleich aus.

openhubguru:
  modes:
    dark: &ohg-palette
      # ── Typografie ────────────────────────────────────────────────
      primary-font-family: &ohg-font-sans 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      paper-font-common-base_-_font-family: *ohg-font-sans
      paper-font-body1_-_font-family: *ohg-font-sans
      ha-font-family-body: *ohg-font-sans
      ha-font-family-heading: *ohg-font-sans
      code-font-family: &ohg-font-mono 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
      ha-font-family-code: *ohg-font-mono

      # ── Hintergründe ──────────────────────────────────────────────
      primary-background-color: "#05070c"
      secondary-background-color: "#0d131f"
      lovelace-background: "#05070c"
      card-background-color: "#121a2b"
      ha-card-background: "#121a2b"
      clear-background-color: "#05070c"
      material-background-color: "#121a2b"
      material-secondary-background-color: "#0d131f"
      mdc-theme-surface: "#121a2b"

      # ── Brand / Akzent ────────────────────────────────────────────
      primary-color: "#38bdf8"
      accent-color: "#38bdf8"
      light-primary-color: "#7dd3fc"
      dark-primary-color: "#0369a1"
      rgb-primary-color: "56, 189, 248"
      rgb-accent-color: "56, 189, 248"
      mdc-theme-primary: "#38bdf8"
      mdc-theme-secondary: "#38bdf8"

      # ── Text ──────────────────────────────────────────────────────
      primary-text-color: "#f8fafc"
      secondary-text-color: "#94a3b8"
      disabled-text-color: "#64748b"
      # Text auf Flächen in primary-color (Cyan) – dunkel wie im Frontend
      # (selection:text-black), weiß hätte auf #38bdf8 zu wenig Kontrast.
      text-primary-color: "#05070c"
      text-accent-color: "#05070c"
      rgb-primary-text-color: "248, 250, 252"
      rgb-secondary-text-color: "148, 163, 184"
      rgb-text-primary-color: "5, 7, 12"
      material-body-text-color: "#f8fafc"
      material-secondary-text-color: "#94a3b8"
      mdc-theme-text-primary-on-background: "#f8fafc"
      mdc-theme-on-primary: "#05070c"

      # ── Rahmen, Karten, Schatten ──────────────────────────────────
      divider-color: "#1e293b"
      outline-color: "#1e293b"
      ha-card-border-color: "#1e293b"
      ha-card-border-width: "1px"
      ha-card-border-radius: "12px"
      ha-card-box-shadow: "0 4px 20px -2px rgba(0, 0, 0, 0.5)"
      ha-card-header-color: "#f8fafc"
      ha-dialog-border-radius: "12px"
      ha-dialog-surface-background: "#121a2b"

      # ── Header & Sidebar ──────────────────────────────────────────
      app-header-background-color: "#0d131f"
      app-header-text-color: "#f8fafc"
      app-header-selection-bar-color: "#38bdf8"
      app-header-border-bottom: "1px solid #1e293b"
      sidebar-background-color: "#0d131f"
      sidebar-menu-button-background-color: "#0d131f"
      sidebar-text-color: "#94a3b8"
      sidebar-icon-color: "#94a3b8"
      sidebar-selected-text-color: "#38bdf8"
      sidebar-selected-icon-color: "#38bdf8"

      # ── Entity-States ─────────────────────────────────────────────
      state-icon-color: "#94a3b8"
      state-icon-active-color: "#38bdf8"
      state-active-color: "#38bdf8"
      state-inactive-color: "#64748b"
      state-unavailable-color: "#64748b"
      paper-item-icon-color: "#94a3b8"
      paper-item-icon-active-color: "#38bdf8"
      history-unavailable-color: "#1e293b"
      state-alarm_control_panel-armed_away-color: "#34d399"
      state-alarm_control_panel-armed_home-color: "#34d399"
      state-alarm_control_panel-pending-color: "#fbbf24"
      state-alarm_control_panel-triggered-color: "#fb7185"
      state-binary_sensor-problem-on-color: "#fb7185"
      state-binary_sensor-safety-on-color: "#fb7185"
      state-binary_sensor-smoke-on-color: "#fb7185"

      # ── Semantische Status-Farben (Pulse/Mesh) ────────────────────
      success-color: "#34d399"
      info-color: "#38bdf8"
      warning-color: "#fbbf24"
      error-color: "#fb7185"
      label-badge-green: "#34d399"
      label-badge-blue: "#38bdf8"
      label-badge-yellow: "#fbbf24"
      label-badge-red: "#fb7185"
      label-badge-grey: "#64748b"
      label-badge-background-color: "#121a2b"
      label-badge-text-color: "#f8fafc"

      # ── Eingaben, Schalter, Slider ────────────────────────────────
      input-fill-color: "#0d131f"
      input-disabled-fill-color: "#0d131f"
      input-ink-color: "#f8fafc"
      input-label-ink-color: "#94a3b8"
      input-disabled-ink-color: "#64748b"
      input-idle-line-color: "#1e293b"
      input-hover-line-color: "#0ea5e9"
      input-outlined-idle-border-color: "#1e293b"
      input-outlined-hover-border-color: "#0ea5e9"
      switch-checked-color: "#38bdf8"
      switch-checked-button-color: "#38bdf8"
      switch-checked-track-color: "rgba(56, 189, 248, 0.3)"
      switch-unchecked-button-color: "#94a3b8"
      switch-unchecked-track-color: "#1e293b"
      slider-color: "#38bdf8"
      slider-secondary-color: "#0ea5e9"
      slider-bar-color: "#1e293b"

      # ── Tabellen, Code, Markdown, Scrollbar ───────────────────────
      data-table-background-color: "#121a2b"
      table-row-background-color: "#121a2b"
      table-row-alternative-background-color: "#0d131f"
      markdown-code-background-color: "#05070c"
      code-editor-background-color: "#05070c"
      codemirror-keyword: "#38bdf8"
      codemirror-property: "#7dd3fc"
      codemirror-string: "#34d399"
      codemirror-number: "#fbbf24"
      codemirror-comment: "#64748b"
      scrollbar-thumb-color: "#1e293b"

    light: *ohg-palette

  # ── card-mod (optional, nur aktiv wenn card-mod installiert ist) ──
  # Glassmorphism, Akzent-Glow und schlanke Scrollbars aus der Spec §2.3.
  card-mod-theme: openhubguru
  # Nur CSS-Strings: card-mod 4.2.1 lädt *-yaml-Theme-Schlüssel über eine
  # Developer-Tools-Route, die es in HA 2026.10 nicht mehr gibt – YAML bleibt hängen.
  # Verschachtelte Shadow-Roots (Rundskalen) daher per card_mod in der Karte.
  card-mod-root: |
    app-toolbar, .header {
      border-bottom: 1px solid #1e293b;
      backdrop-filter: blur(12px);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(5, 7, 12, 0.6); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
  card-mod-card: |
    ha-card {
      background: rgba(18, 26, 43, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    ha-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02) inset, 0 0 24px -6px rgba(56, 189, 248, 0.35);
    }
    /* Icon-Glow in der Zustandsfarbe (wie OpenHubGuru: drop-shadow(var(--st))),
       nur für aktive Zustände – inaktive Icons bleiben flach. */
    ha-tile-icon:not([data-state="off"]):not([data-state="unavailable"]):not([data-state="unknown"]):not([data-state="closed"]):not([data-state="idle"]):not([data-state="standby"]):not([data-state="not_home"]) ha-state-icon {
      filter: drop-shadow(0 0 4px var(--tile-color)) drop-shadow(0 0 10px var(--tile-color));
    }
    mushroom-shape-icon ha-state-icon {
      filter: drop-shadow(0 0 4px var(--icon-color, var(--primary-color)));
    }
    /* Graphen. Sensor-Karte: Linie in --accent-color, Glow in derselben Farbe. */
    hui-graph-header-footer {
      filter: drop-shadow(0 0 4px var(--accent-color)) drop-shadow(0 0 10px var(--accent-color));
    }
    /* HA-Charts (Statistik, Verlauf) zeichnen auf Canvas, ApexCharts/Plotly haben die
       Serienfarbe in Gradients bzw. Inline-Styles – per CSS nicht greifbar, daher hier
       Brand-Cyan. Farbtreuer Glow je Serie: per card_mod in der Karte (überschreibt das). */
    statistics-chart, state-history-charts {
      filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.35)) drop-shadow(0 0 6px rgba(56, 189, 248, 0.2));
    }
    path.apexcharts-line, .scatterlayer path.js-line {
      filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.55)) drop-shadow(0 0 8px rgba(56, 189, 248, 0.25));
    }
  # Modern-Circular-Gauge-Badge: Bogen in der Skalenfarbe.
  card-mod-badge: |
    g > path.arc.current {
      filter: drop-shadow(0 0 4px var(--gauge-color)) drop-shadow(0 0 10px var(--gauge-color));
    }
